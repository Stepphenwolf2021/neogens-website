.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;background:#B8F04A;color:#08090A;font-size:14px;font-weight:600;

body{background:var(--bg);color:var(--fg)}
.k{color:var(--mute)}
p{color:var(--dim)}
a.btn{background:var(--go);color:var(--on-go)}
a.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.tgl{margin-top:26px;background:transparent;border:1px solid var(--line-2);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);padding:0}
