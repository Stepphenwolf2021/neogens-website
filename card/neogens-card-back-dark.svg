    </pattern>
    <radialGradient id="glowb" cx="50%" cy="50%" r="66%">
      <stop offset="0%" stop-color="#B8F04A" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#B8F04A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="550" fill="#08090A"/>
