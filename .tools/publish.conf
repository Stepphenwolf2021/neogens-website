# ─────────────────────────────────────────────────────────────────────────
# ค่าตั้งของ publish.sh — โปรเจกต์ neogens-website
#
# ตัวสคริปต์ .tools/publish.sh เป็นฉบับกลางจาก ~/projects/publish-kit
# **ห้ามแก้ publish.sh เฉพาะโปรเจกต์นี้** ถ้าต้องแก้ แปลว่ามีค่าที่ควรมาอยู่ในไฟล์นี้
# หรือเป็นเรื่องที่ควรแก้ที่ต้นแบบแล้วกระจายกลับไปทุกโปรเจกต์
# ─────────────────────────────────────────────────────────────────────────

PROJECT_NAME="Neo Gens website"

# ตัวตรวจโครงสร้าง 74 ไฟล์ · หยุดเมื่อเจอ error · เตือนอย่างเดียวไม่หยุด
CHECK_CMD="python3 .tools/check.py"

# GitHub Pages ขึ้นเองหลัง push ไม่มีขั้น deploy แยก
DEPLOY_CMD=""

# ที่ที่ต้องเปิดดูหลัง publish
# km-for-museums.html เป็นทางเบี่ยง ไม่ใช่หน้าจริง เอาไว้เช็กว่าทางเบี่ยงยังทำงาน
# /nonsense เอาไว้เช็กว่า 404 ยังขึ้นหน้าของเราเอง ไม่ใช่หน้ามาตรฐานของ GitHub
VERIFY_URLS="https://www.neogens.co/
https://www.neogens.co/th-index.html
https://www.neogens.co/mkm-for-coffee.html
https://www.neogens.co/km-for-museums.html
https://www.neogens.co/nonsense"

# หน้าที่สคริปต์ตรวจแทนไม่ได้ ต้องเปิดดูด้วยตา
# เลือกไว้ห้าหน้าเพราะครอบสิ่งที่พังบ่อยคนละแบบ
#   index          สามประตูหน้าแรกกับเมนู
#   th-index       ตัวอักษรไทย ระยะบรรทัด ป้ายเมนูยาว
#   mkm-for-museums-and-libraries  หน้ายาวที่มีบล็อกหลายชนิดปนกัน
#   th-mkm-for-coffee              ฟอร์มกับ textarea ที่เพิ่งเพิ่ม
#   th-coffee-demo                 แดชบอร์ดที่ CSS พังเงียบมาแล้วสองรอบ
MANUAL_CHECKS="index.html
th-index.html
mkm-for-museums-and-libraries.html
th-mkm-for-coffee.html
th-coffee-demo.html"

DEFAULT_MSG="Update site"

REMIND="ดูทั้งธีมมืดและสว่าง สองความกว้าง · km-for-museums.html ต้องเด้งไป long-read · /nonsense ต้องขึ้น 404 ของเราเอง"
